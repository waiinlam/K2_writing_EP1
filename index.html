<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>直昇機降落任務</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* 外圍加上深色背景，讓遊戲主畫面更突出 */
            background-color: #b2ebf2; 
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
            touch-action: none; 
        }

        #game-container {
            position: relative;
            /* 鎖定遊戲畫面的長寬比例，確保背景圖在任何設備都不會變形或裁切 */
            height: 100vh;
            max-height: 100vh;
            max-width: 100vw;
            aspect-ratio: 3 / 4.2; /* 貼合 6.png 的預估原始比例 */
            
            background-image: url('6.png');
            background-size: 100% 100%; /* 強制填滿鎖定比例的容器 */
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        #progress-bar {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 24px;
            z-index: 10;
            background: rgba(255,255,255,0.85);
            padding: 5px 15px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        #line-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        #safe-path {
            stroke: rgba(255, 255, 255, 0.45); 
            /* 寬度會由 JavaScript 自動對齊綠色圈圈的寬度 */
            stroke-linecap: round;
        }

        #drag-line {
            stroke: #ffeb3b;
            stroke-width: 8;
            stroke-dasharray: 15;
            stroke-linecap: round;
            opacity: 0.9;
        }

        /* 直昇機縮小 */
        #helicopter {
            position: absolute;
            width: 90px; /* 已縮小尺寸 */
            height: auto;
            z-index: 10;
            cursor: grab;
            transform: translate(-50%, -50%);
            mix-blend-mode: multiply; 
            transition: transform 0.1s;
        }
        
        #helicopter:active {
            cursor: grabbing;
            transform: translate(-50%, -50%) scale(1.1);
        }

        /* 終點圈：使用百分比精準貼合背景的綠色圖案 */
        #target-area {
            position: absolute;
            /* 下方兩個百分比決定黃圈的大小和高低。若有 1~2mm 偏差，可微調這裡的數字 */
            width: 22.5%; 
            bottom: 4.2%; 
            
            aspect-ratio: 1 / 1; /* 確保是正圓形 */
            left: 50%;
            transform: translateX(-50%);
            
            /* 使用 solid 實線邊框，更容易看清是否完美貼合圓周 */
            border: 6px solid #ffeb3b; 
            border-radius: 50%;
            box-sizing: border-box; /* 關鍵：讓邊框往內計算，精準貼合 */
            z-index: 2;
            animation: blinkHint 1.2s infinite alternate;
            pointer-events: none;
        }

        @keyframes blinkHint {
            0% { opacity: 0.4; box-shadow: 0 0 5px #ffeb3b; }
            100% { opacity: 1; box-shadow: 0 0 25px #ffeb3b; }
        }

        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #level-modal { background: rgba(255,255,255,0.85); }
        #success-modal { background: rgba(0,0,0,0.7); }

        .modal.show {
            display: flex;
            animation: popIn 0.5s ease-out forwards;
        }

        .modal-text {
            font-size: 34px;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
            line-height: 1.4;
        }

        #level-modal .modal-text {
            color: #ff5722;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }

        #success-modal .modal-text {
            color: #fff;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .emoji-art { font-size: 70px; }

        .restart-btn {
            padding: 15px 30px;
            font-size: 24px;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="progress-bar">🚁 0/5</div>
    
    <svg id="line-canvas">
        <line id="safe-path" x1="0" y1="0" x2="0" y2="0" />
        <line id="drag-line" x1="0" y1="0" x2="0" y2="0" style="display: none;" />
    </svg>

    <div id="target-area"></div>
    <img id="helicopter" src="1.png" alt="直昇機" draggable="false" />

    <div id="level-modal" class="modal">
        <div class="emoji-art">🌟🚁🎉</div>
        <div class="modal-text">欣賞你努力嘗試！</div>
    </div>

    <div id="success-modal" class="modal">
        <div class="modal-text">✨ 任務全部完成！✨<br>你真努力！</div>
        <button class="restart-btn" onclick="startGame()">再玩一次</button>
    </div>
    
    <audio id="cheer-sound" src="https://actions.google.com/sounds/v1/crowds/children_cheering.ogg" preload="auto"></audio>
</div>

<script>
    const helicopter = document.getElementById('helicopter');
    const container = document.getElementById('game-container');
    const targetArea = document.getElementById('target-area');
    const safePath = document.getElementById('safe-path');
    const dragLine = document.getElementById('drag-line');
    const progressBar = document.getElementById('progress-bar');
    const levelModal = document.getElementById('level-modal');
    const successModal = document.getElementById('success-modal');
    const cheerSound = document.getElementById('cheer-sound');

    // 確保 GitHub 上的檔名是全小寫的 3.png
    const images = ['1.png', '2.png', '3.png', '4.jpg', '5.png'];
    let currentLevel = 0;
    
    let isDragging = false;
    let startX = 0, startY = 0, targetX = 0, targetY = 0;
    let maxDeviation = 50; 

    function updateLayout() {
        const containerRect = container.getBoundingClientRect();
        const targetRect = targetArea.getBoundingClientRect();

        // 設置起點：左右置中，高度設於 26% (雲朵下方)
        startX = containerRect.width / 2;
        startY = containerRect.height * 0.26; 

        // 設置終點：黃色圓圈中心點
        targetX = (targetRect.left - containerRect.left) + targetRect.width / 2;
        targetY = (targetRect.top - containerRect.top) + targetRect.height / 2;

        // 畫出安全通道
        safePath.setAttribute('x1', startX);
        safePath.setAttribute('y1', startY);
        safePath.setAttribute('x2', targetX);
        safePath.setAttribute('y2', targetY);
        
        // 動態讓安全通道的寬度 = 綠色圓形的寬度
        safePath.setAttribute('stroke-width', targetRect.width);
        
        // 容錯範圍為通道寬度的一半
        maxDeviation = targetRect.width / 2; 
    }

    // 螢幕旋轉或改變大小時，重新計算座標
    window.addEventListener('resize', () => {
        updateLayout();
        if(!isDragging) resetHelicopterPosition();
    });

    function startGame() {
        currentLevel = 0;
        successModal.classList.remove('show');
        // 等待畫面完全渲染後再抓取尺寸
        setTimeout(() => {
            updateLayout();
            loadLevel();
        }, 50);
    }

    function loadLevel() {
        progressBar.innerText = `🚁 ${currentLevel}/5`;
        helicopter.src = images[currentLevel];
        resetHelicopterPosition();
    }

    function resetHelicopterPosition() {
        helicopter.style.transition = 'top 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28), left 0.4s ease'; 
        helicopter.style.left = `${startX}px`;
        helicopter.style.top = `${startY}px`;
        dragLine.style.display = 'none';
    }

    helicopter.addEventListener('pointerdown', (e) => {
        isDragging = true;
        helicopter.style.transition = 'none'; 
        
        dragLine.setAttribute('x1', startX);
        dragLine.setAttribute('y1', startY);
        dragLine.style.display = 'block';

        helicopter.setPointerCapture(e.pointerId);
    });

    helicopter.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        
        const containerRect = container.getBoundingClientRect();
        let currentX = e.clientX - containerRect.left;
        let currentY = e.clientY - containerRect.top;

        currentX = Math.max(0, Math.min(currentX, containerRect.width));
        currentY = Math.max(0, Math.min(currentY, containerRect.height));

        // 如果超出通道左右範圍，彈回起點
        if (Math.abs(currentX - startX) > maxDeviation) {
            isDragging = false;
            helicopter.releasePointerCapture(e.pointerId);
            resetHelicopterPosition(); 
            return; 
        }

        helicopter.style.left = `${currentX}px`;
        helicopter.style.top = `${currentY}px`;

        dragLine.setAttribute('x2', currentX);
        dragLine.setAttribute('y2', currentY);
    });

    helicopter.addEventListener('pointerup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        helicopter.releasePointerCapture(e.pointerId);

        const heliRect = helicopter.getBoundingClientRect();
        const heliCenterX = heliRect.left - container.getBoundingClientRect().left + heliRect.width / 2;
        const heliCenterY = heliRect.top - container.getBoundingClientRect().top + heliRect.height / 2;

        const distance = Math.sqrt(
            Math.pow(heliCenterX - targetX, 2) + 
            Math.pow(heliCenterY - targetY, 2)
        );

        // 如果進入目標圈範圍 (判斷標準縮小以匹配縮小的直昇機)
        if (distance < targetArea.getBoundingClientRect().width / 1.5) { 
            levelComplete();
        } else {
            resetHelicopterPosition();
        }
    });

    function levelComplete() {
        dragLine.style.display = 'none';
        
        helicopter.style.transition = 'all 0.3s';
        helicopter.style.left = `${targetX}px`;
        helicopter.style.top = `${targetY}px`;
        
        cheerSound.currentTime = 0; 
        cheerSound.play().catch(e => console.log("瀏覽器阻擋自動播放音效"));

        levelModal.classList.add('show');
        
        setTimeout(() => {
            levelModal.classList.remove('show');
            currentLevel++;
            
            if (currentLevel >= images.length) {
                progressBar.innerText = `🚁 5/5`;
                successModal.classList.add('show'); 
            } else {
                loadLevel();
            }
        }, 2500); 
    }

    // 初始化啟動
    window.onload = startGame;
</script>
</body>
</html>
