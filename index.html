<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>直昇機降落任務</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #e0f7fa;
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
            touch-action: none; 
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 600px; 
            margin: 0 auto;
            /* 修正1: 背景改回 6.png */
            background-image: url('6.png');
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        #progress-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 28px;
            z-index: 10;
            background: rgba(255,255,255,0.8);
            padding: 5px 15px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        #line-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* 修正4: 安全通道修窄，與綠色 H 圖案寬度 (約 120px) 對齊 */
        #safe-path {
            stroke: rgba(255, 255, 255, 0.5); 
            stroke-width: 120; 
            stroke-linecap: round;
        }

        #drag-line {
            stroke: #ffeb3b;
            stroke-width: 8;
            stroke-dasharray: 15;
            stroke-linecap: round;
            opacity: 0.9;
        }

        /* 修正3: 直昇機縮小 (調整為 160px，比例更適中) */
        #helicopter {
            position: absolute;
            width: 160px; 
            height: auto;
            z-index: 10;
            cursor: grab;
            transform: translate(-50%, -50%);
            mix-blend-mode: multiply; 
            transition: transform 0.1s;
        }
        
        #helicopter:active {
            cursor: grabbing;
            transform: translate(-50%, -50%) scale(1.05);
        }

        /* 修正2: 黃色終點圈對齊綠色圖案位置與大小 */
        #target-area {
            position: absolute;
            bottom: 6.5%; /* 往下對齊綠色 H 的圓心 */
            left: 50%;
            transform: translateX(-50%);
            width: 120px; /* 寬度與背景 H 圈一致 */
            height: 120px;
            border: 6px dashed #ffeb3b;
            border-radius: 50%;
            z-index: 2;
            animation: blinkHint 1.5s infinite alternate;
            pointer-events: none;
        }

        @keyframes blinkHint {
            0% { transform: translateX(-50%) scale(0.9); opacity: 0.5; box-shadow: 0 0 10px #ffeb3b; }
            100% { transform: translateX(-50%) scale(1.1); opacity: 1; box-shadow: 0 0 30px #ffeb3b; }
        }

        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #level-modal { background: rgba(255,255,255,0.85); }
        #success-modal { background: rgba(0,0,0,0.6); }

        .modal.show {
            display: flex;
            animation: popIn 0.5s ease-out forwards;
        }

        .modal-text {
            font-size: 38px;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
            line-height: 1.4;
        }

        #level-modal .modal-text {
            color: #ff5722;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }

        #success-modal .modal-text {
            color: #fff;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .emoji-art { font-size: 80px; }

        .restart-btn {
            padding: 15px 30px;
            font-size: 24px;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="progress-bar">🚁 0/5</div>
    
    <svg id="line-canvas">
        <line id="safe-path" x1="0" y1="0" x2="0" y2="0" />
        <line id="drag-line" x1="0" y1="0" x2="0" y2="0" style="display: none;" />
    </svg>

    <div id="target-area"></div>
    <img id="helicopter" src="1.png" alt="直昇機" draggable="false" />

    <div id="level-modal" class="modal">
        <div class="emoji-art">🌟🚁🎉</div>
        <div class="modal-text">欣賞你努力嘗試！</div>
    </div>

    <div id="success-modal" class="modal">
        <div class="modal-text">✨ 任務全部完成！✨<br>你真棒！</div>
        <button class="restart-btn" onclick="startGame()">再玩一次</button>
    </div>
    
    <audio id="cheer-sound" src="https://actions.google.com/sounds/v1/crowds/children_cheering.ogg" preload="auto"></audio>
</div>

<script>
    const helicopter = document.getElementById('helicopter');
    const container = document.getElementById('game-container');
    const targetArea = document.getElementById('target-area');
    const safePath = document.getElementById('safe-path');
    const dragLine = document.getElementById('drag-line');
    const progressBar = document.getElementById('progress-bar');
    const levelModal = document.getElementById('level-modal');
    const successModal = document.getElementById('success-modal');
    const cheerSound = document.getElementById('cheer-sound');

    // 如果第3關出不來，請檢查這裡的 '3.png' 是否與你 GitHub 上的檔名完全一致 (包括小寫)
    const images = ['1.png', '2.png', '3.png', '4.png', '5.png'];
    let currentLevel = 0;
    
    let isDragging = false;
    let startX = 0, startY = 0, targetX = 0, targetY = 0;
    
    // 修正: 起點移至 28% 的高度，確保直昇機位於雲朵下方
    const initTopPercent = 28; 
    // 修正: 通道變窄後，容忍度也跟著調低為 60 (通道寬度 120 的一半)
    const maxDeviation = 60; 

    function updateLayout() {
        const containerRect = container.getBoundingClientRect();
        const targetRect = targetArea.getBoundingClientRect();

        startX = containerRect.width / 2;
        startY = (containerRect.height * initTopPercent) / 100;

        targetX = (targetRect.left - containerRect.left) + targetRect.width / 2;
        targetY = (targetRect.top - containerRect.top) + targetRect.height / 2;

        safePath.setAttribute('x1', startX);
        safePath.setAttribute('y1', startY);
        safePath.setAttribute('x2', targetX);
        safePath.setAttribute('y2', targetY);
    }

    window.addEventListener('resize', updateLayout);

    function startGame() {
        currentLevel = 0;
        successModal.classList.remove('show');
        updateLayout();
        loadLevel();
    }

    function loadLevel() {
        progressBar.innerText = `🚁 ${currentLevel}/5`;
        helicopter.src = images[currentLevel];
        resetHelicopterPosition();
    }

    function resetHelicopterPosition() {
        helicopter.style.transition = 'top 0.4s ease, left 0.4s ease'; 
        helicopter.style.left = `${startX}px`;
        helicopter.style.top = `${startY}px`;
        dragLine.style.display = 'none';
    }

    helicopter.addEventListener('pointerdown', (e) => {
        isDragging = true;
        helicopter.style.transition = 'none'; 
        
        dragLine.setAttribute('x1', startX);
        dragLine.setAttribute('y1', startY);
        dragLine.style.display = 'block';

        helicopter.setPointerCapture(e.pointerId);
    });

    helicopter.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        
        const containerRect = container.getBoundingClientRect();
        let currentX = e.clientX - containerRect.left;
        let currentY = e.clientY - containerRect.top;

        currentX = Math.max(0, Math.min(currentX, containerRect.width));
        currentY = Math.max(0, Math.min(currentY, containerRect.height));

        // 如果超出通道左右 60px 範圍，就彈回起點
        if (Math.abs(currentX - startX) > maxDeviation) {
            isDragging = false;
            helicopter.releasePointerCapture(e.pointerId);
            resetHelicopterPosition(); 
            return; 
        }

        helicopter.style.left = `${currentX}px`;
        helicopter.style.top = `${currentY}px`;

        dragLine.setAttribute('x2', currentX);
        dragLine.setAttribute('y2', currentY);
    });

    helicopter.addEventListener('pointerup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        helicopter.releasePointerCapture(e.pointerId);

        const heliRect = helicopter.getBoundingClientRect();
        const heliCenterX = heliRect.left - container.getBoundingClientRect().left + heliRect.width / 2;
        const heliCenterY = heliRect.top - container.getBoundingClientRect().top + heliRect.height / 2;

        const distance = Math.sqrt(
            Math.pow(heliCenterX - targetX, 2) + 
            Math.pow(heliCenterY - targetY, 2)
        );

        if (distance < 70) { 
            levelComplete();
        } else {
            resetHelicopterPosition();
        }
    });

    function levelComplete() {
        dragLine.style.display = 'none';
        
        helicopter.style.transition = 'all 0.3s';
        helicopter.style.left = `${targetX}px`;
        helicopter.style.top = `${targetY}px`;
        
        cheerSound.currentTime = 0; 
        cheerSound.play().catch(e => console.log("瀏覽器阻擋自動播放音效"));

        levelModal.classList.add('show');
        
        setTimeout(() => {
            levelModal.classList.remove('show');
            currentLevel++;
            
            if (currentLevel >= images.length) {
                progressBar.innerText = `🚁 5/5`;
                successModal.classList.add('show'); 
            } else {
                loadLevel();
            }
        }, 2500); 
    }

    setTimeout(startGame, 100); 
</script>
</body>
</html>
